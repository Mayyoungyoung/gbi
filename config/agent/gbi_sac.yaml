# @package _group_
name: gbi_sac

# 注意（L7 可读性陷阱）：identity encoder 下此值在运行时被 experiment.prepare_config()
# 强制覆盖为 env obs 维度（MT10=39），此处 50 仅是非 identity encoder 的占位缺省；
# actor 的 MLP 输入维度经 encoder.yaml 的 ${agent.encoder_feature_dim} 惰性插值取值。
# 离线 hydra compose 验证 shape 时必须复现该覆盖，否则会误报尺寸不匹配。
encoder_feature_dim: 50
num_layers: 0
num_filters: 0

# ---- GbI 裁决配置（mtrl.agent.gbi_sac.Agent 的 gbi_cfg 输入） ----
gbi:
  enabled: True
  # 裁决公式: gbi = Q 锚 + λ_t·(Î_j−Î_i)；qmp = λ≡0 消融基线；imag = 纯想象
  arbiter_mode: gbi
  # 触发: adaptive = U_score 自适应；fixed_K = 固定步频；always = 每步
  trigger_mode: adaptive
  H: 5
  gamma: 0.99
  W: 10000
  rho_on: 0.9
  rho_reject: 0.99
  tau_off_ratio: 0.7
  K_min: 3
  K_max: 15
  m_low: 3
  fixed_K: 10
  calibrate_window: 500
  # 护栏开关：此前只在 Arbiter.__init__ 里有默认值、无法从配置覆盖，
  # GbI.md §5.3 要求的护栏消融因此必须改代码；现全部暴露为配置项。
  guardrail_reject: True
  switch_requires_positive_gain: True
  # G3：正增益换手门仅在 λ_t>0（想象通道被校准门认可）时生效 →
  # λ_t=0 时严格退化为 QMP，兑现 GbI.md §3.2「κ_t≤0 平滑退化为纯 QMP」的设计声明；
  # 置 False 恢复旧行为（门与 λ_t 无关、始终生效 → 实际退化为纯 own 策略）。
  gain_gate_requires_trust: True
  # 世界模型训练 + TTA
  wm_update_every: 1
  wm_batch_size: 1024
  tta_enabled: True
  tta_recent_n: 5
  # G6：eval 是否走「贪婪仲裁」（每步 argmax_j S_j 的均值动作）。
  # 默认 False = 历史行为（eval 只测裸 own 策略，与 CTPG 基线可比）；
  # 置 True 才能测到 GbI 的产品「own + 仲裁」整体。建议正式 arm 两个口径都跑。
  eval_with_arbiter: False
  # 候选快照池（Phase 0/M3：state_sac 训练快照的 model_dir 与 step 列表）
  candidates_dir: null
  candidate_steps: []
  # 跨任务候选池（P0.1，2026-09-03）：候选 = 现役 actor 的 N 个任务 head
  # （CTPG 同池语义：任务 j 的策略可在任务 i 上被裁决接管；own = 任务 i head）。
  # enabled 时忽略 candidates_dir 与 online_candidates（互斥，避免池语义混杂）
  cross_task_candidates:
    enabled: False
  # 在线自举候选（免预训练直接开训，2026-09-02）：enabled 时每 interval 步
  # 将现役 actor 快照（deepcopy+冻结）入池，FIFO 保留最近 max_count 个；
  # 与 candidates_dir 可叠加（先淘汰更老的磁盘快照）。像 CTPG 一样开箱即训时：
  #   candidates_dir 留 null + online_candidates.enabled=true
  online_candidates:
    enabled: False
    interval: 25000
    warmup: 20000
    max_count: 4
  source_log_dump_every: 10000

builder:
  _target_: mtrl.agent.gbi_sac.Agent
  # obs_shape
  # action_shape
  # device
  actor_cfg: ${agent.actor}
  critic_cfg: ${agent.critic}
  multitask_cfg: ${agent.multitask}
  alpha_optimizer_cfg: ${agent.optimizers.alpha}
  actor_optimizer_cfg: ${agent.optimizers.actor}
  critic_optimizer_cfg: ${agent.optimizers.critic}
  discount: 0.99
  init_temperature: 1.0
  actor_update_freq: 1
  critic_tau: 0.01
  critic_target_update_freq: 1
  encoder_tau: 0.05
  loss_reduction: alpha_weight
  # GbI 新增
  gbi_cfg: ${agent.gbi}
  world_model_cfg: ${agent.components.world_model}