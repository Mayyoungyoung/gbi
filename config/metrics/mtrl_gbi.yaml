# @package _group_
train:
  [
      # The format is [key, abbr, type, average/constant]
      # If a key ends with "_", n (= number of envs),
      # copies of the metric are created.
    [episode, E, int, average],
    [step, S, int, average],
    [duration, D, time, average],
    [episode_reward, R, float, average],
    [success, Su, float, average],
    [batch_reward, BR, float, average],
    [actor_loss, ALOSS, float, average],
    [critic_loss, CLOSS, float, average],
    [actor_mask, AMASK, int, average],
    [critic_mask, CMASK, int, average],
    [ae_loss, RLOSS, float, average],
    [ae_transition_loss, null, float, average],
    [reward_loss, null, float, average],
    [actor_target_entropy, null, float, average],
    [actor_entropy, null, float, average],
    [alpha_loss, null, float, average],
    [alpha_, null, float, average],
    [alpha_value, null, float, average],
    [contrastive_loss, MLOSS, float, average],
    [max_rat, MR, float, average],
    [env_index, ENV, str, constant],
    [reward_, R_, float, average],
    [success_, Su_, float, average],
    [env_step_, ES_, float, average],
    [env_index_, ENV_, str, constant],
    [batch_reward_agent_index_, null, float, average],
    [critic_loss_agent_index_, AGENT_, float, average],
    [actor_distilled_agent_loss_agent_index_, null, float, average],
    [actor_loss_agent_index_, null, float, average],
    [actor_target_entropy_agent_index_, null, float, average],
    [actor_entropy_agent_index_, null, float, average],
    [alpha_loss_agent_index_, null, float, average],
    [alpha_value_agent_index_, null, float, average],
    [ae_loss_agent_index_, null, float, average],
    # ---- GbI 世界模型/裁决器 metric ----
    [wm_loss, WL, float, average],
    [wm_state_loss, WSL, float, average],
    [wm_obs_loss, WOL, float, average],
    [wm_reward_loss, WRL, float, average],
    [wm_residual_stream_reward_loss, WRS, float, average],
    [wm_grad_norm, WGN, float, average],
    [wm_dyn_obs_mae, DMAE, float, average],
    # ---- 奖励分箱健康度（G2 修复：±400 硬钉导致 101 bin 只用 3 个）----
    [wm_reward_absmax, RABS, float, average],
    [wm_reward_bin_utilization, RBU, float, average],
    [wm_reward_range_expansions, REXP, float, average],
    # 奖励头排序保真度（GbI.md §5.1 验收口径“排序准”）——以前无法在线观测
    [wm_reward_rank_corr, RRK, float, average],
    [arbiter/lambda_t, LT, float, average],
    [arbiter/kappa_t, KT, float, average],
    [arbiter/tau_on, TON, float, average],
    [arbiter/tau_reject, TREJ, float, average],
    [arbiter/u_window_len, UWL, int, average],
    [arbiter/calib_len, CLL, int, average],
    # ---- 决策场密度（go/no-go 口径“gap 中位数 > 0.1 / gain 分布非退化”
    #      此前无任何指标可观测，只能事后跑 eval_decision_field.py）----
    [arbiter/gain_abs_median, GAM, float, average],
    [arbiter/gain_max_median, GMM, float, average],
    [arbiter/gain_pos_frac, GPF, float, average],
    [arbiter/q_spread_median, QSM, float, average],
    [arbiter/i_own_median, IOM, float, average],
    [gbi_trigger_rate, TGR, float, average],
    [gbi_switch_rate, SWR, float, average],
    [gbi_uscore_ema, UEM, float, average],
    [gbi_seg_len_mean, SLM, float, average],
    [gbi_seg_count, SGC, int, average],
    [gbi_adapt_loss_before, ALB, float, average],
    [gbi_adapt_loss_after, ALA, float, average],
  ]
eval:
  [
    [episode, E, int, average],
    [step, S, int, average],
    [episode_reward, R, float, average],
    [env_index, ENV, str, constant],
    [success, Su, float, average],
    [episode_reward_, R_, float, average],
    [success_, Su_, float, average],
    [env_step_, ES_, float, average],
    # [env_index_, ENV_, str, constant],
    [batch_reward_agent_index_, AGENT_, float, average],
  ]